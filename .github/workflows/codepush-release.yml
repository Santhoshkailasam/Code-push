name: CodePush Auto-Release & Live Sync

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: Build Bundle & Deploy OTA Update
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: ⚙️ Generate Version Metadata & Compute Commit Hash
        id: vars
        run: |
          VERSION="1.1.$(date +'%Y%m%d%H%M')"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: 🔨 Build React Native / Web Mobile Bundle
        run: |
          mkdir -p build_output
          # Build bundle or dist package
          if npm run | grep -q "build"; then
            npm run build
          fi

      - name: 🚀 Publish Release to CodePush Server & Phones
        run: |
          curl -X POST "${{ secrets.CODEPUSH_SERVER_URL || 'https://codepush-demo.netlify.app/.netlify/functions/publish-release' }}" \
            -H "Content-Type: application/json" \
            -H "x-codepush-api-key: ${{ secrets.CODEPUSH_API_KEY || 'cp_live_sec_key_demo_2026' }}" \
            -d '{
              "platform": "android",
              "version": "'"${{ steps.vars.outputs.version }}"'",
              "downloadUrl": "https://codepush-demo.netlify.app/bundles/'"${{ steps.vars.outputs.commit_sha }}"'.zip",
              "hash": "sha256-gh-'"${{ steps.vars.outputs.commit_sha }}"'",
              "mandatory": true,
              "releaseNotes": "Git Push Commit: '"${{ steps.vars.outputs.commit_msg }}"'"
            }'

      - name: ✅ Verification & Status Report
        run: |
          echo "🎉 CodePush auto-version created successfully!"
          echo "📱 Version ${{ steps.vars.outputs.version }} is now live and propagating to connected mobile phones!"
