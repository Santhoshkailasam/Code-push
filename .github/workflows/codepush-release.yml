name: CodePush Auto-Release & Live Sync

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: Build Bundle & Deploy OTA Update
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: ⚙️ Generate Version Metadata & Compute Commit Hash
        id: vars
        run: |
          VERSION="1.1.$(date +'%Y%m%d%H%M')"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: 🔨 Build React Native / Web Mobile Bundle
        run: |
          mkdir -p build_output
          # Build bundle or dist package
          if npm run | grep -q "build"; then
            npm run build
          fi

      - name: 🚀 Publish Release to CodePush Server & Mobile Devices
        run: |
          node bin/codepush.mjs release-react \
            --app "${{ secrets.CODEPUSH_APP_ID || 'app_rCYp1a_mvdfs5j4_w9dyc' }}" \
            --key "${{ secrets.CODEPUSH_API_KEY || 'cp_live_sec_key_demo_2026' }}" \
            --platform android \
            --version "${{ steps.vars.outputs.version }}" \
            --track production \
            --rollout 100 \
            --canary 30 \
            --mandatory \
            --notes "CI/CD: ${{ steps.vars.outputs.commit_msg }}" \
            --webhook "${{ secrets.CODEPUSH_WEBHOOK_URL || '' }}"

      - name: ✅ Verification & Status Report
        run: |
          echo "🎉 CodePush auto-version created successfully!"
          echo "📱 Version ${{ steps.vars.outputs.version }} is now live and propagating to connected mobile phones!"
